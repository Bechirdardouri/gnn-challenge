name: Sync Leaderboard From Encrypted Submissions

on:
  push:
    branches: [ main ]
    paths:
      - "submissions/*.enc"
      - "submissions/**/*.enc"
      - "submissions/*.csv"
      - "submissions/**/*.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write private key from secret
        env:
          PRIVATE_KEY_PEM: ${{ secrets.PRIVATE_KEY_PEM }}
        run: |
          if [ -z "${PRIVATE_KEY_PEM}" ]; then
            echo "Missing required secret: PRIVATE_KEY_PEM"
            exit 1
          fi
          mkdir -p .secrets
          printf '%s' "${PRIVATE_KEY_PEM}" > .secrets/private_key.pem
          chmod 600 .secrets/private_key.pem

      - name: Materialize private labels
        env:
          PRIVATE_TEST_LABELS_CSV: ${{ secrets.PRIVATE_TEST_LABELS_CSV }}
          TEST_LABELS_KEY: ${{ secrets.TEST_LABELS_KEY }}
          PRIVATE_DATA_METHOD: ${{ secrets.PRIVATE_DATA_METHOD }}
          GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          PRIVATE_DATA_URL: ${{ secrets.PRIVATE_DATA_URL }}
          PRIVATE_DATA_S3_URI: ${{ secrets.PRIVATE_DATA_S3_URI }}
        run: |
          mkdir -p data/private
          if [ -n "${PRIVATE_TEST_LABELS_CSV}" ]; then
            printf '%s' "${PRIVATE_TEST_LABELS_CSV}" > data/private/test_labels.csv
          elif [ -n "${TEST_LABELS_KEY}" ] && [ -f data/test_labels.csv.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in data/test_labels.csv.enc \
              -out data/private/test_labels.csv \
              -pass pass:${TEST_LABELS_KEY}
          else
            python scripts/download_private_data.py \
              --method "${PRIVATE_DATA_METHOD:-google_drive}" \
              --output data/private/test_labels.csv \
              --google-drive-file-id "${GOOGLE_DRIVE_FILE_ID}" \
              --google-credentials-json "${GOOGLE_CREDENTIALS_JSON}" \
              --url "${PRIVATE_DATA_URL}" \
              --s3-uri "${PRIVATE_DATA_S3_URI}" \
              --force
          fi

      - name: Process repository submissions
        env:
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          python scripts/process_repository_encrypted_submissions.py \
            --submissions-dir "submissions" \
            --include-plaintext-csv \
            --private-key-path ".secrets/private_key.pem" \
            --private-key-password "${PRIVATE_KEY_PASSWORD}" \
            --private-labels-path "data/private/test_labels.csv" \
            --test-nodes-path "data/test.csv" \
            --leaderboard-path "leaderboard/leaderboard.csv"

      - name: Render leaderboard assets
        run: python competition/render_leaderboard.py

      - name: Commit updates
        env:
          BASE_REF: main
        run: |
          if git diff --quiet; then
            echo "No leaderboard changes."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add leaderboard/leaderboard.csv leaderboard/leaderboard.md docs/leaderboard.json
          git commit -m "Sync leaderboard from encrypted submissions"
          git push origin "HEAD:${BASE_REF}"
